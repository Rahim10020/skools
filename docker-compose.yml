services:
  postgres:
    image: postgres:16-alpine
    container_name: skools-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: skools
      POSTGRES_PASSWORD: skools_secret
      POSTGRES_DB: skools
    volumes:
      - skools_pg_data:/var/lib/postgresql/data

volumes:
  skools_pg_data: